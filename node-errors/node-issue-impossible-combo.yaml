apiVersion: v1
kind: Pod
metadata:
  name: node-bad-impossible-combo
  namespace: three-tier-app
spec:
  nodeSelector:
    kubernetes.io/os: windows
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: ["arm64"]
  containers:
    - name: app
      image: nginx:alpine
