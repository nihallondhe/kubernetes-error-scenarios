apiVersion: v1
kind: Pod
metadata:
  name: node-bad-affinity
  namespace: three-tier-app
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/gpu
                operator: In
                values: ["true"]
  containers:
    - name: app
      image: nginx:alpine
