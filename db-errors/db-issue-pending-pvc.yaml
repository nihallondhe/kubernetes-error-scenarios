apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-bad-pvc
  namespace: three-tier-app
spec:
  serviceName: postgres-bad-pvc
  replicas: 1
  selector:
    matchLabels:
      app: postgres-bad-pvc
  template:
    metadata:
      labels:
        app: postgres-bad-pvc
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: appdb
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: apppassword
          volumeMounts:
            - name: postgres-bad-pvc-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-bad-pvc-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: no-such-storage-class
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-bad-pvc
  namespace: three-tier-app
spec:
  selector:
    app: postgres-bad-pvc
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
